name: Cloud DevOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t venkatagirikumarmareboina/cloud-devops-web:latest .

      - name: Test Docker image
        run: |
          docker run --rm -d -p 8080:80 --name ci-test venkatagirikumarmareboina/cloud-devops-web:latest
          sleep 5
          curl --fail http://localhost:8080
          docker stop ci-test

      - name: Push Docker image
        run: docker push venkatagirikumarmareboina/cloud-devops-web:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull venkatagirikumarmareboina/cloud-devops-web:latest
            docker stop cloud-devops-web || true
            docker rm cloud-devops-web || true
            docker run -d \
              --name cloud-devops-web \
              -p 80:80 \
              venkatagirikumarmareboina/cloud-devops-web:latest
            docker ps
            curl --fail http://localhost
