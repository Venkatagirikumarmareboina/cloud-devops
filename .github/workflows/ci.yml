name: Cloud DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t venkatagirikumarmareboina/cloud-devops-web:latest .

      - name: Push Docker image
        run: docker push venkatagirikumarmareboina/cloud-devops-web:latest

      - name: Test Docker image
        run: docker run --rm -d -p 8080:80 --name ci-test venkatagirikumarmareboina/cloud-devops-web:latest
