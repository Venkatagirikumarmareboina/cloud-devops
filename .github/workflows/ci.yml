name: Cloud DevOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloud-devops-web:ci .

      - name: Test Docker image
        run: docker run --rm -d -p 8080:80 --name ci-test cloud-devops-web:ci
